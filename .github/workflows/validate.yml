name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - URSB-optimization

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      PLAYWRIGHT_OUTPUT_DIR: artifacts/playwright-output

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run integrated release gate
        run: npm run validate

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation-${{ github.run_id }}
          path: artifacts/playwright-output
          if-no-files-found: ignore
          retention-days: 14
